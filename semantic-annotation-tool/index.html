<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Analysis Annotation Tool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Semantic Analysis Annotation Tool</h1>
        <div class="progress-container">
          <div id="progress-bar">
            <div id="progress-fill"></div>
          </div>
          <span id="progress-text">0/0 Reviews</span>
        </div>
      </header>

      <div class="import-section">
        <div class="file-upload">
          <label for="file-input" class="file-label">
            <span class="file-icon">📁</span>
            <span>Choose TXT File</span>
          </label>
          <input type="file" id="file-input" accept=".txt" />
        </div>
        <button class="btn primary" onclick="importAnnotations()">
          Import
        </button>
        <div class="navigation-buttons">
          <button class="btn secondary" onclick="prevReview()">
            <span class="nav-icon">←</span> Previous
          </button>
          <button class="btn secondary" onclick="nextReview()">
            Next <span class="nav-icon">→</span>
          </button>
        </div>
      </div>

      <div class="review-container">
        <div class="review-header">
          <span id="review-number" class="review-badge">Review #N/A</span>
        </div>
        <textarea
          id="review-input"
          placeholder="Each review from your imported file will be displayed here"
          readonly
        ></textarea>
      </div>

      <div class="annotation-form">
        </div>

        </div>

        <div class="form-section">
          <h3>Sentiment</h3>
          <div id="sentiment" class="radio-group">
            <label class="radio-label">
              <input type="radio" name="sentiment" value="positive" />
              <span class="radio-custom sentiment positive">Positive</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="sentiment" value="negative" />
              <span class="radio-custom sentiment negative">Negative</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="sentiment" value="neutral" />
              <span class="radio-custom sentiment neutral">Neutral</span>
            </label>
          </div>
        </div>

        </div>

      <button class="btn success save-btn" onclick="saveReview()">
        Save Label Annotations
      </button>

      <div class="dataset-container">
        <div class="dataset-header">
          <h3>Labeled Dataset</h3>
          <button class="btn primary" onclick="downloadAnnotations()">
            Download Dataset (JSON)
          </button>
        </div>
        <div id="annotated-dataset"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
